[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "heart-alignment-api"
version = "0.1.0"
description = "Phase 1 API foundation for the Heart Alignment website"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<0.116",
  "firebase-admin>=6.6,<8.0",
  "google-cloud-firestore>=2.21,<3.0",
  "openai>=1.54,<2.0",
  "pydantic-settings>=2.6,<3.0",
  "uvicorn[standard]>=0.32,<1.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1.0",
  "pytest>=8.3,<9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["app*"]
