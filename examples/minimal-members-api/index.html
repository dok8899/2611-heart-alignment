<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f6f7f3" />
    <title>心靈契合｜會員管理</title>
    <style>
      :root{font-family:Inter,"Noto Sans TC","PingFang TC",sans-serif;color:#263b32;background:#f6f7f3;font-synthesis:none;text-rendering:optimizeLegibility;-webkit-font-smoothing:antialiased}
      *{box-sizing:border-box}body{margin:0;min-width:320px}.shell{width:min(980px,calc(100% - 36px));margin:0 auto;padding:48px 0 72px}.eyebrow{font-size:11px;letter-spacing:.18em;color:#768b7d}.heading{display:flex;justify-content:space-between;align-items:end;gap:18px;margin-bottom:28px}.heading h1{font:500 clamp(34px,6vw,54px)/1.2 Georgia,"Noto Serif TC",serif;margin:12px 0 0}.heading p{color:#738278;line-height:1.7;margin:0;max-width:380px}.layout{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(260px,.8fr);gap:18px}.panel{background:#fff;border:1px solid #dce4dc;border-radius:20px;padding:24px;box-shadow:0 16px 45px #263b320c}.panel h2{font:500 24px Georgia,"Noto Serif TC",serif;margin:0 0 18px}.member-list{display:grid;gap:10px}.member{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:15px 16px;border:1px solid #e3e9e3;border-radius:14px;background:#fcfdfa}.member-main{display:flex;align-items:center;gap:13px;min-width:0}.avatar{display:grid;place-items:center;flex:0 0 42px;height:42px;border-radius:50%;background:#edf2ec;color:#4c6858;font-weight:650}.member-name{font-weight:650}.member-meta{font-size:13px;color:#79877e;margin-top:3px}.badge{flex:none;padding:6px 10px;border-radius:99px;background:#f3eff1;color:#705769;font-size:12px}.field{display:grid;gap:7px;margin-bottom:15px}.field label{font-size:13px;font-weight:600;color:#455b4f}.field input,.field select{width:100%;height:46px;padding:0 12px;border:1px solid #d8e1d9;border-radius:10px;background:white;color:#263b32;font:inherit}.field input:focus,.field select:focus{outline:3px solid #68837135;border-color:#688371}.submit{width:100%;height:46px;border:0;border-radius:99px;background:#506d5d;color:white;font:inherit;font-weight:650;cursor:pointer}.submit:disabled{opacity:.6;cursor:wait}.notice{min-height:22px;margin:12px 0 0;font-size:13px;color:#63756a;line-height:1.6}.notice.error{color:#a24848}.notice.success{color:#3c7852}.empty{padding:22px;text-align:center;color:#7d8981;border:1px dashed #d9e1d9;border-radius:14px}.count{color:#7c8980;font-size:13px}.loading{color:#7c8980}.footer-note{margin-top:17px;color:#869188;font-size:12px;line-height:1.7}
      @media(max-width:760px){.shell{padding-top:30px}.heading{align-items:flex-start;flex-direction:column}.layout{grid-template-columns:1fr}.panel{padding:19px}.member{align-items:flex-start;flex-direction:column}.badge{margin-left:55px}}
    </style>
  </head>
  <body>
    <main class="shell">
      <header class="heading">
        <div><div class="eyebrow">MEMBER DIRECTORY</div><h1>會員資料</h1></div>
        <p>列表由會員 API 即時載入；新增資料會送至後端保存於目前執行中的服務。</p>
      </header>
      <div class="layout">
        <section class="panel" aria-labelledby="members-title">
          <h2 id="members-title">會員列表 <span class="count" id="member-count"></span></h2>
          <div class="member-list" id="member-list" aria-live="polite"><p class="loading">正在載入會員資料…</p></div>
          <p class="notice" id="load-notice" role="status"></p>
        </section>
        <section class="panel" aria-labelledby="add-title">
          <h2 id="add-title">新增會員</h2>
          <form id="member-form">
            <div class="field"><label for="name">姓名</label><input id="name" name="name" maxlength="80" required autocomplete="name" /></div>
            <div class="field"><label for="age">年齡</label><input id="age" name="age" type="number" min="18" max="100" step="1" required /></div>
            <div class="field"><label for="membership">會員類別</label><select id="membership" name="membership" required><option value="體驗會員">體驗會員</option><option value="城市體驗">城市體驗</option><option value="年度會員">年度會員</option></select></div>
            <button class="submit" id="submit-button" type="submit">新增會員</button>
            <p class="notice" id="form-notice" role="status" aria-live="polite"></p>
          </form>
        </section>
      </div>
      <p class="footer-note">此單檔範例使用記憶體保存；重新啟動 Python server 後新增會員會重置。請勿輸入真實個人資料。</p>
    </main>
    <script>
      const list = document.querySelector("#member-list");
      const count = document.querySelector("#member-count");
      const loadNotice = document.querySelector("#load-notice");
      const form = document.querySelector("#member-form");
      const formNotice = document.querySelector("#form-notice");
      const submitButton = document.querySelector("#submit-button");

      function renderMembers(members) {
        count.textContent = `(${members.length})`;
        if (!members.length) {
          list.innerHTML = '<div class="empty">目前沒有會員資料</div>';
          return;
        }
        list.replaceChildren(...members.map((member) => {
          const row = document.createElement("article");
          row.className = "member";
          const main = document.createElement("div");
          main.className = "member-main";
          const avatar = document.createElement("span");
          avatar.className = "avatar";
          avatar.textContent = member.name.slice(0, 1);
          const detail = document.createElement("div");
          const name = document.createElement("div");
          name.className = "member-name";
          name.textContent = member.name;
          const meta = document.createElement("div");
          meta.className = "member-meta";
          meta.textContent = `會員編號 ${member.id} · ${member.age} 歲`;
          detail.append(name, meta);
          main.append(avatar, detail);
          const badge = document.createElement("span");
          badge.className = "badge";
          badge.textContent = member.membership;
          row.append(main, badge);
          return row;
        }));
      }

      async function loadMembers() {
        list.innerHTML = '<p class="loading">正在載入會員資料…</p>';
        loadNotice.className = "notice";
        try {
          const response = await fetch("/api/members", { headers: { Accept: "application/json" } });
          const data = await response.json();
          if (!response.ok) throw new Error(data.error || "讀取會員資料失敗");
          renderMembers(data);
          loadNotice.textContent = "會員資料已從 API 載入。";
        } catch (error) {
          list.innerHTML = '<div class="empty">無法載入會員資料</div>';
          loadNotice.className = "notice error";
          loadNotice.textContent = `${error.message}。請確認 Python server 正在執行，並由 http://localhost:8000 開啟頁面。`;
        }
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        formNotice.className = "notice";
        formNotice.textContent = "正在新增…";
        submitButton.disabled = true;
        const values = new FormData(form);
        const member = { name: String(values.get("name")).trim(), age: Number(values.get("age")), membership: values.get("membership") };
        try {
          const response = await fetch("/api/members", {
            method: "POST",
            headers: { "Content-Type": "application/json", Accept: "application/json" },
            body: JSON.stringify(member),
          });
          const data = await response.json();
          if (!response.ok) throw new Error(data.error || "新增會員失敗");
          form.reset();
          formNotice.className = "notice success";
          formNotice.textContent = `已新增 ${data.name}（會員編號 ${data.id}）。`;
          await loadMembers();
        } catch (error) {
          formNotice.className = "notice error";
          formNotice.textContent = error.message;
        } finally {
          submitButton.disabled = false;
        }
      });

      loadMembers();
    </script>
  </body>
</html>
